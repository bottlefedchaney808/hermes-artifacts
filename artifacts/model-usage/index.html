        ctx.shadowBlur = embed ? 10 : 0;
        ctx.shadowColor = embed ? (GROUP_COLOR[n.group] || '#94a3b8') : 'transparent';

    // ---- Fallback: compact hand-rolled sim when d3 is absent (spec §6). ----
    function fallbackStep() {

      for (i = 0; i < links.length; i++) {
        e = links[i];
        dx = e.target.x - e.source.x; dy = e.target.y - e.source.y; dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        f = (dist - 46) * 0.012;
        e.source.vx += dx / dist * f; e.source.vy += dy / dist * f;
        e.target.vx -= dx / dist * f; e.target.vy -= dy / dist * f;
      }
      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];

        n.vx += (g.x - n.x) * 0.004 + (-n.x) * 0.002;
        n.vy += (g.y - n.y) * 0.004 + (-n.y) * 0.002;
        if (dragNode !== n) { n.vx *= 0.72; n.vy *= 0.72; n.x += n.vx; n.y += n.vy; }

      var newK = clampK(view.k * factor);
      view.tx = p.mx - (p.mx - view.tx) * (newK / view.k);
      view.ty = p.my - (p.my - view.ty) * (newK / view.k);
      view.k = newK;
    }
    function onDown(ev) {
      var p = pointer(ev);
      downX = p.mx; downY = p.my; lastX = p.mx; lastY = p.my;
      dragNode = pick(p.mx, p.my);
      if (dragNode) { mode = 'drag'; if (hasD3) sim.alphaTarget(0.3); } // fallback: reposition only (spec §6)
      else if (!dragNode && hasD3) { mode = 'pan'; }
    }

        dragNode.y = (p.my - view.ty) / view.k;
        dragNode.vx = 0; dragNode.vy = 0;
      } else if (mode === 'pan') {
        view.tx += p.mx - lastX; view.ty += p.my - lastY;
        lastX = p.mx; lastY = p.my;
      } else {
        hover = pick(p.mx, p.my);
        tip.style.display = hover ? 'block' : 'none';
        if (hover) {
          var unresolved = String(hover.id).indexOf('dangling:') === 0;
          tip.textContent = hover.label + '  ·  ' + hover.group + '  ·  deg ' + (deg[hover.id] || 0) +
            (unresolved ? '  ·  unresolved link' : '');
          tip.style.left = (p.mx + 12) + 'px';
          tip.style.top = (p.my + 12) + 'px';

      }
    }
    function onUp(ev) {
      var p = pointer(ev);
      if (mode === 'drag') sim.alphaTarget(0);
      // Click = up with negligible movement.
      if (Math.hypot(p.mx - downX, p.my - downY) < 4 && dragNode) {
        openNote(dragNode);
      } else if (String((pick(p.mx, p.my) || {}).id).indexOf('dangling:') === 0) {
        showToast('Unresolved link');
      }
      mode = null; dragNode = null;
    }

    var sim = null;
    // Single-instance guard: only one live Jarvis graph at a time. If renderGraph is
    // called again (re-render / refresh), tear down the previous instance first so
    // window-level listeners + rAF loop never accumulate across renders.
    if (typeof activeJarvisDestroy === 'function') { try { activeJarvisDestroy(); } catch (e) {} }

    // Auto-fit: frame the whole graph in ~90% of the stage, centered (like Obsidian's fit-to-view).
    function autoFit() {
      if (!nodes.length) return;
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      for (var j = 0; j < nodes.length; j++) {
        n = nodes[j];
        if (n.x < minX) minX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.x > maxX) maxX = n.x;
        if (n.y > maxY) maxY = n.y;
      }

      view.k = clampK(Math.min(cssW * 0.9 / bw, cssH * 0.9 / bh));

    }

    function start() {
      resize();
      // Center world origin in the viewport so the ~260-radius attractor circle fits.
      view.tx = cssW / 2;
      view.ty = cssH / 2;
      window.addEventListener('resize', resize);
      var ro = null;
      if (typeof ResizeObserver !== 'undefined') {
        ro = new ResizeObserver(function () { resize(); });
        ro.observe(stage);
      }
      if (hasD3) {
        // d3-force physics with the exact verified v7 API surface.
        sim = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(function (d) { return d.id; })
            .distance(46)
            .strength(function (l) {
              var idOf = function (x) { return typeof x === 'object' ? x.id : x; };
              return 0.5 / Math.max(deg[idOf(l.source)] || 1, deg[idOf(l.target)] || 1);
            }))
          .force('charge', d3.forceManyBody().theta(0.9)
            .strength(function (nd) { return -10 * (1 + Math.sqrt(nd.size) * 0.4); }))
          .force('collide', d3.forceCollide(radius).iterations(2))
          .force('gx', d3.forceX(function (nd) { return (attract[nd.group] || { x: 0 }).x; })
            .strength(function (nd) { return cohesionStrength(nd.group); }))
          .force('gy', d3.forceY(function (nd) { return (attract[nd.group] || { y: 0 }).y; })
            .strength(function (nd) { return cohesionStrength(nd.group); }));

        canvas.addEventListener('wheel', onWheel, { passive: false });
      } else {
        // Settle the hand-rolled sim synchronously before first paint.
        for (var t = 0; t < 150; t++) fallbackStep();
      }
      canvas.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);

      var fitted = false;
      function maybeFit() { if (!fitted) { autoFit(); fitted = true; } }
      if (hasD3) setTimeout(maybeFit, 1500); // let the sim settle before framing
      else maybeFit();

      var rafId = 0;
      function loop() {
        if (!hasD3) fallbackStep(); // keep the static layout gently alive / responsive to drag
        draw();
        rafId = requestAnimationFrame(loop);
      }
      loop();

      // Teardown: stop rAF, remove every listener this instance added (window-level ones
      // outlive the DOM box that render() clears), and halt the sim. Called by a later
      // renderGraph via activeJarvisDestroy so re-renders never stack handlers/loops.
      function destroy() {
        cancelAnimationFrame(rafId);
        window.removeEventListener('resize', resize);
        if (ro) { try { ro.disconnect(); } catch (e) {} }
        canvas.removeEventListener('wheel', onWheel);
        canvas.removeEventListener('mousedown', onDown);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        if (sim && sim.stop) { try { sim.alphaTarget(0).stop(); } catch (e) {} }
      }

    if (document.readyState === 'loading') {

    } else {

    }

  }

      if (d.graph && (d.graph.nodes || []).length) root.appendChild(renderGraph(d.graph));
      else root.appendChild(renderGraph(null));

    }
    root.appendChild(h('h1', { text: d.title || d.artifact_id }));
    root.appendChild(h('div', { class: 'ha-sub', text: 'Generated '
      + d.generated_at + (d.source && d.source.note ? ' - ' + d.source.note : '') }));
    if ((d.summary || []).length) root.appendChild(renderCards(d));
    if (d.graph && (d.graph.nodes || []).length) root.appendChild(renderGraph(d.graph));
    (d.charts || []).forEach(function (c) { root.appendChild(renderChart(c)); });
    (d.tables || []).forEach(function (t) { root.appendChild(renderTable(t)); });

      var ul = h('ul', { class: 'ha-notes' });

    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    render(document.getElementById('app'));
  });
})();

<script id="mu-js">
/* ECharts show-off layer with cross-filtering. Re-aggregates viz.rows in-browser

(function () {
  'use strict';
  var F = { profile: null, lane: null };   // active cross-filter
  var charts = {}, V = null, PAL = null;

  function payload() {
    var el = document.getElementById('hermes-artifact-data');
    return el ? JSON.parse(el.textContent) : null;
  }
  function fmt(n) {
    n = +n || 0;
    if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }
  var IDX = { profile: 0, lane: 1, model: 2, task: 3, fresh: 4, cached: 5, day: 6 };

  function rows() {
    return V.rows.filter(function (r) {
      if (F.profile && r[IDX.profile] !== F.profile) return false;
      if (F.lane && r[IDX.lane] !== F.lane) return false;
      return true;
    });
  }
  function sum(rs, field) {
    var t = 0; for (var i = 0; i < rs.length; i++) t += rs[i][IDX[field]] || 0; return t;
  }
  function group(rs, field) {
    var m = {}, out = [];
    for (var i = 0; i < rs.length; i++) {
      var k = rs[i][IDX[field]];
      m[k] = (m[k] || 0) + (rs[i][IDX.fresh] || 0);
    }
    for (var k2 in m) if (m.hasOwnProperty(k2)) out.push({ name: k2, value: m[k2] });
    out.sort(function (a, b) { return b.value - a.value; });
    return out;
  }
  function color(i) { return PAL[i % PAL.length]; }
  function laneColor(name, i) { return name === 'local' ? '#4ade80' : color(i); }

  var TXT = { color: 'rgba(255,255,255,.72)' };
  var SPLIT = { lineStyle: { color: 'rgba(255,255,255,.06)' } };
  var AXIS = { axisLine: { lineStyle: { color: 'rgba(255,255,255,.16)' } }, axisLabel: TXT };
  function money(n) { return '$' + (+n || 0).toFixed(2); }

  /* ---- KPI strip with count-up animation ---- */
  function kpis() {
    var rs = rows();
    var fresh = sum(rs, 'fresh'), cached = sum(rs, 'cached');
    var local = 0;
    for (var i = 0; i < rs.length; i++) if (rs[i][IDX.lane] === 'local') local += rs[i][IDX.fresh];
    var pct = fresh ? Math.round(100 * local / fresh) : 0;
    var eff = fresh ? (cached / fresh) : 0;
    var spec = [
      { k: 'Fresh tokens', v: fresh, f: fmt },
      { k: 'Cached reads', v: cached, f: fmt },
      { k: 'Cache ratio', v: eff, f: function (x) { return x.toFixed(1) + '\u00d7'; } },
      { k: 'Est. cost', v: V.totals.cost_usd, f: money, cls: 'accent' },

  function init(id) {

          { r0: '48%', r: '90%', label: { position: 'outside', color: 'rgba(255,255,255,.75)',
            fontSize: 10, silent: false }, itemStyle: { opacity: .82 } }] }]
    }, true);

    init('c-model').setOption({

      xAxis: Object.assign({ type: 'value', splitLine: SPLIT,

      yAxis: Object.assign({ type: 'category',

        axisLabel: { color: 'rgba(255,255,255,.72)', formatter: fmt } }, { axisLine: AXIS.axisLine }),
      yAxis: Object.assign({ type: 'category',
        data: profs.map(function (p) { return p.name; }).reverse() }, AXIS),
      series: [{ type: 'bar', barMaxWidth: 15, itemStyle: { borderRadius: [0, 6, 6, 0] },
        label: { show: true, position: 'right', color: 'rgba(255,255,255,.85)',
          fontSize: 10, formatter: function (o) { return fmt(o.value); } },
        data: profs.slice().reverse().map(function (p, i) {
          return { value: p.value, itemStyle: { color: color(i + 3),
            opacity: (!F.profile || F.profile === p.name) ? 1 : .3 } };
        }) }]
    }, true);

    /* 8. Task split */
    var tasks = group(rs, 'task').slice(0, 10);
    init('c-task').setOption({
      grid: { left: 4, right: 60, top: 8, bottom: 8, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: fmt },
      xAxis: Object.assign({ type: 'value', splitLine: SPLIT,
        axisLabel: { color: 'rgba(255,255,255,.72)', formatter: fmt } }, { axisLine: AXIS.axisLine }),
      yAxis: Object.assign({ type: 'category',
        data: tasks.map(function (t) { return t.name === 'main' ? 'main loop' : t.name; }).reverse() }, AXIS),
      series: [{ type: 'bar', barMaxWidth: 15, itemStyle: { borderRadius: [0, 6, 6, 0] },
        label: { show: true, position: 'right', color: 'rgba(255,255,255,.85)',
          fontSize: 10, formatter: function (o) { return fmt(o.value); } },
        data: tasks.slice().reverse().map(function (t, i) {
          return { value: t.value,
            itemStyle: { color: t.name === 'main' ? '#38bdf8' : color(i + 1) } };
        }) }]
    }, true);
  }

  function label() {
    document.getElementById('mu-filter').innerHTML =
      (F.profile ? 'profile <b>' + F.profile + '</b>' : 'all profiles') + ' &middot; ' +
      (F.lane ? 'provider <b>' + F.lane + '</b>' : 'all providers');
  }
  function refresh() { label(); kpis(); draw(); }

  function boot() {
    var d = payload();
    if (!d || !d.viz || !d.viz.rows || typeof echarts === 'undefined') return; // fallback stays
    V = d.viz; PAL = V.palette;
    document.getElementById('mu').className = 'on';
    refresh();
    charts['c-lane'].on('click', function (p) {
      F.lane = (F.lane === p.name) ? null : p.name; refresh();
    });
    charts['c-prof'].on('click', function (p) {
      F.profile = (F.profile === p.name) ? null : p.name; refresh();
    });
    document.getElementById('mu-reset').addEventListener('click', function () {
      F.profile = null; F.lane = null; refresh();
    });
    var t;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () {
        for (var k in charts) if (charts.hasOwnProperty(k)) charts[k].resize();
      }, 120);
    });
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else setTimeout(boot, 0);
})();
</script>
</body>
</html>
