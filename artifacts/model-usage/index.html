   Uses Hermes ::preview theme vars when present; var() fallbacks keep it

* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  color: var(--foreground, #1a1a1a);
  background: var(--card, transparent);
  font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
h1 { font-size: 20px; margin: 0 0 2px; }
.ha-sub { color: var(--muted-foreground, #6b6b6b); font-size: 12px; margin-bottom: 16px; }
.ha-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 16px; }
.ha-card { border: 1px solid var(--border, #e8e6e0); border-radius: 10px; padding: 12px 14px; }
.ha-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted-foreground, #8a8a8a); }
.ha-card .value { font-size: 22px; font-weight: 650; margin-top: 3px; }
.ha-card.tone-ok .value { color: #1a7f37; }
.ha-card.tone-bad .value { color: #c0341d; }
.ha-chart { border: 1px solid var(--border, #e8e6e0); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; }
.ha-chart h3 { font-size: 14px; margin: 0 0 8px; }
.ha-chart .box { position: relative; height: 280px; }
.ha-tablewrap { border: 1px solid var(--border, #e8e6e0); border-radius: 10px;
  padding: 10px 12px 14px; margin-bottom: 16px; overflow-x: auto; }
.ha-tablewrap h3 { font-size: 14px; margin: 2px 0 8px; }
.ha-filter { width: 220px; padding: 4px 8px; margin-bottom: 8px;
  border: 1px solid var(--border, #ccc); border-radius: 6px;
  background: transparent; color: inherit; font: inherit; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; white-space: nowrap;
  border-bottom: 1px solid var(--border, #efece5); }
th { cursor: pointer; color: var(--muted-foreground, #6b6b6b);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }
tbody tr:nth-child(odd) { background: var(--ha-zebra, transparent); }
tbody tr:hover { background: var(--ha-hover, rgba(148,163,184,.12)); }
tr:last-child td { border-bottom: none; }
.ha-notes { color: var(--muted-foreground, #6b6b6b); font-size: 12px; }
.ha-notes li { margin-bottom: 4px; }
.ha-graph { border: 1px solid var(--border, #e8e6e0); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; }
.ha-graph h3 { font-size: 14px; margin: 0 0 8px; }
.ha-glegend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px;
  color: var(--muted-foreground, #6b6b6b); margin-bottom: 8px; }
.ha-glegend .swatch { display: inline-flex; align-items: center; gap: 6px; }
.ha-glegend i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
/* Jarvis graph stage: base color only here (kills white-flash before JS paints).

   it would double-paint under the canvas fill. */

.ha-gstage canvas { display: block; width: 100%; height: 560px; cursor: grab; }
.ha-gtip { display: none; position: absolute; pointer-events: none; }
.ha-gtip { background: rgba(8,12,20,.92); border: 1px solid rgba(148,163,184,.35); color: #e5e7eb; border-radius: 6px; padding: 4px 8px; box-shadow: 0 0 6px rgba(0,0,0,.4); font-size: 12px; }
.ha-ghost-toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(8,12,20,.92); border: 1px solid rgba(148,163,184,.35); color: #e5e7eb; opacity: 0; transition: opacity .25s ease; pointer-events: none; }

.ha-glegend i { box-shadow: 0 0 6px rgba(255,255,255,.35); }

/* Embed / Brain-tab mode: graph only, no white chrome, full viewport. */
html.ha-embed, html.ha-embed body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #05070c; color: #e5e7eb;
}
html.ha-embed #app { height: 100%; }
html.ha-embed .ha-graph {
  border: none; padding: 0; margin: 0; border-radius: 0;
  height: 100%; display: flex; flex-direction: column; position: relative;
}
html.ha-embed .ha-graph h3 { display: none; }
html.ha-embed .ha-glegend {
  position: absolute; z-index: 2; left: 12px; bottom: 12px;

html.ha-embed .ha-glegend i { box-shadow: 0 0 10px currentColor; }

<!-- Custom layer: SIBLING of #app (never a child - render() clears #app). -->
<section id="mu">

</section>

    for (var i = 0; i < rs.length; i++) if (rs[i][IDX.lane] === 'local') local += rs[i][IDX.fresh];
    var pct = fresh ? Math.round(100 * local / fresh) : 0;
    var eff = fresh ? (cached / fresh) : 0;
    var spec = [
      { k: 'Fresh tokens', v: fresh, f: fmt },
      { k: 'Cached reads', v: cached, f: fmt },
      { k: 'Cache ratio', v: eff, f: function (x) { return x.toFixed(1) + '\u00d7'; } },
      { k: 'Est. cost', v: V.totals.cost_usd, f: money, cls: 'accent' },
      { k: 'Local share', v: pct, f: function (x) { return Math.round(x) + '%'; }, cls: 'ok' },
      { k: 'Models', v: V.totals.models, f: function (x) { return String(Math.round(x)); } }
    ];
    var wrap = document.getElementById('mu-kpis');
    wrap.innerHTML = '';
    spec.forEach(function (s) {
      var el = document.createElement('div');
      el.className = 'mu-kpi' + (s.cls ? ' ' + s.cls : '');
      el.innerHTML = '<div class="k">' + s.k + '</div><div class="v">0</div>';
      wrap.appendChild(el);
      var node = el.querySelector('.v'), t0 = null, dur = 700;
      function step(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        node.textContent = s.f(s.v * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function init(id) {
    var el = document.getElementById(id);
    if (!charts[id]) charts[id] = echarts.init(el, null, { renderer: 'canvas' });
    return charts[id];
  }

  function draw() {
    var rs = rows();

    /* 1. Lines over time, one per provider. Unstacked on purpose: with a
       dominant lane a stacked area turns every other series into an
       invisible hairline. */
    var ts = V.timeseries;
    init('c-time').setOption({
      grid: { left: 58, right: 36, top: 30, bottom: 30 },
      tooltip: { trigger: 'axis', valueFormatter: fmt },
      legend: { top: 0, textStyle: Object.assign({ fontSize: 12 }, TXT), itemWidth: 12, itemHeight: 12 },
      xAxis: [Object.assign({ type: 'category', boundaryGap: false, data: ts.days }, AXIS)],
      yAxis: [Object.assign({ type: 'value', splitLine: SPLIT,
        axisLabel: { color: 'rgba(255,255,255,.85)', formatter: fmt } }, { axisLine: AXIS.axisLine })],
      series: ts.series.map(function (s, i) {
        var c = laneColor(s.name, i);
        return {
          name: s.name, type: 'line', smooth: true, symbol: 'circle', symbolSize: 3,
          lineStyle: { width: 2, color: c }, itemStyle: { color: c },
          emphasis: { focus: 'series' }, data: s.data
        };
      })
    }, true);

    /* 2. Lane doughnut - click to filter */
    var lanes = group(V.rows, 'lane');
    init('c-lane').setOption({
      tooltip: { trigger: 'item', formatter: function (p) {
        return p.name + '<br/>' + fmt(p.value) + ' fresh (' + p.percent + '%)'; } },
      legend: { bottom: 0, textStyle: TXT, itemWidth: 10, itemHeight: 10 },
      series: [{
        type: 'pie', radius: ['52%', '78%'], center: ['50%', '44%'], avoidLabelOverlap: true,
        padAngle: 2, itemStyle: { borderRadius: 6 },
        label: { show: true, position: 'center', formatter: function () {
          return fmt(sum(rows(), 'fresh')); }, color: '#fff', fontSize: 20, fontWeight: 700 },
        emphasis: { label: { show: true, fontSize: 20 }, scaleSize: 6 },
        data: lanes.map(function (d, i) {
          return { name: d.name, value: d.value,
            itemStyle: { color: laneColor(d.name, i),
              opacity: (!F.lane || F.lane === d.name) ? 1 : .28 } };
        })
      }]
    }, true);

    /* 3. Calendar heatmap */
    var cal = ts.calendar || [];
    if (cal.length) {
      var maxv = 0; cal.forEach(function (c) { if (c[1] > maxv) maxv = c[1]; });
      var yr = cal[cal.length - 1][0].slice(0, 4);
      init('c-cal').setOption({
        tooltip: { formatter: function (p) { return p.value[0] + '<br/>' + fmt(p.value[1]) + ' fresh'; } },
        visualMap: { min: 0, max: maxv || 1, calculable: false, orient: 'horizontal',
          left: 'center', bottom: 0, textStyle: TXT, itemWidth: 11, itemHeight: 90,
          inRange: { color: ['#0b2942', '#155e75', '#0ea5e9', '#38bdf8', '#a5f3fc'] } },
        calendar: { top: 20, left: 40, right: 20, cellSize: ['auto', 16], range: yr,
          itemStyle: { color: 'rgba(255,255,255,.03)', borderColor: 'rgba(255,255,255,.07)', borderWidth: 1 },
          splitLine: { show: false }, yearLabel: { show: false },
          dayLabel: { color: 'rgba(255,255,255,.45)', nameMap: 'en' },
          monthLabel: { color: 'rgba(255,255,255,.60)', nameMap: 'en' } },
        series: [{ type: 'heatmap', coordinateSystem: 'calendar', data: cal }]
      }, true);
    }

    /* 4. Sunburst: lane > model */
    var tree = {};
    rs.forEach(function (r) {
      var l = r[IDX.lane], m = r[IDX.model];
      tree[l] = tree[l] || {};
      tree[l][m] = (tree[l][m] || 0) + (r[IDX.fresh] || 0);
    });
    var sun = Object.keys(tree).map(function (l, i) {
      var c = laneColor(l, i);
      var kids = Object.keys(tree[l]).map(function (m) { return { name: m, value: tree[l][m] }; })
        .sort(function (a, b) { return b.value - a.value; }).slice(0, 8);
      return { name: l, itemStyle: { color: c }, children: kids };
    }).sort(function (a, b) { return b.children.length - a.children.length; });
    init('c-sun').setOption({
      tooltip: { formatter: function (p) { return p.name + '<br/>' + fmt(p.value) + ' fresh'; } },
      series: [{ type: 'sunburst', data: sun, radius: [24, '92%'], sort: 'desc',
        emphasis: { focus: 'ancestor' },
        levels: [{}, { r0: 24, r: '48%', label: { rotate: 0, color: '#fff', fontSize: 11 },
            itemStyle: { borderWidth: 2, borderColor: 'rgba(0,0,0,.45)' } },
          { r0: '48%', r: '90%', label: { position: 'outside', color: 'rgba(255,255,255,.75)',
            fontSize: 10, silent: false }, itemStyle: { opacity: .82 } }] }]
    }, true);

    /* 5. Top models - horizontal bars */
    var models = group(rs, 'model').slice(0, 12).reverse();
    init('c-model').setOption({
      grid: { left: 4, right: 66, top: 8, bottom: 8, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: fmt },
      xAxis: Object.assign({ type: 'value', splitLine: SPLIT,
        axisLabel: { color: 'rgba(255,255,255,.72)', formatter: fmt } }, { axisLine: AXIS.axisLine }),
      yAxis: Object.assign({ type: 'category',
        data: models.map(function (m) { return m.name.length > 26 ? m.name.slice(0, 25) + '\u2026' : m.name; }) }, AXIS),
      series: [{ type: 'bar', barMaxWidth: 15,
        itemStyle: { borderRadius: [0, 6, 6, 0] },
        label: { show: true, position: 'right', color: 'rgba(255,255,255,.85)',
          fontSize: 10, formatter: function (o) { return fmt(o.value); } },
        data: models.map(function (m, i) {
          return { value: m.value, itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: 'rgba(56,189,248,.25)' }, { offset: 1, color: color(models.length - i) }]) } };
        }) }]
    }, true);

    /* 6. Sankey flow */
    var sk = V.sankey;
    if (sk && sk.links && sk.links.length) {
      init('c-flow').setOption({
        tooltip: { trigger: 'item', triggerOn: 'mousemove', valueFormatter: fmt },
        series: [{ type: 'sankey', data: sk.nodes, links: sk.links,
          emphasis: { focus: 'adjacency' }, nodeAlign: 'left',
          left: 12, right: 130, top: 14, bottom: 14,
          label: { color: 'rgba(255,255,255,.85)', fontSize: 11 },
          lineStyle: { color: 'gradient', opacity: .38, curveness: .5 },
          itemStyle: { borderWidth: 0 },
          levels: [{ depth: 0, itemStyle: { color: '#38bdf8' } },
                   { depth: 1, itemStyle: { color: '#a78bfa' } },
                   { depth: 2, itemStyle: { color: '#4ade80' } }] }]
      }, true);
    }

    /* 7. Profiles - click to filter */
    var profs = group(V.rows, 'profile').slice(0, 10);
    init('c-prof').setOption({
      grid: { left: 4, right: 60, top: 8, bottom: 8, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: fmt },
      xAxis: Object.assign({ type: 'value', splitLine: SPLIT,
        axisLabel: { color: 'rgba(255,255,255,.72)', formatter: fmt } }, { axisLine: AXIS.axisLine }),
      yAxis: Object.assign({ type: 'category',
        data: profs.map(function (p) { return p.name; }).reverse() }, AXIS),
      series: [{ type: 'bar', barMaxWidth: 15, itemStyle: { borderRadius: [0, 6, 6, 0] },
        label: { show: true, position: 'right', color: 'rgba(255,255,255,.85)',
          fontSize: 10, formatter: function (o) { return fmt(o.value); } },
        data: profs.slice().reverse().map(function (p, i) {
          return { value: p.value, itemStyle: { color: color(i + 3),
            opacity: (!F.profile || F.profile === p.name) ? 1 : .3 } };
        }) }]
    }, true);

    /* 8. Task split */
    var tasks = group(rs, 'task').slice(0, 10);
    init('c-task').setOption({
      grid: { left: 4, right: 60, top: 8, bottom: 8, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: fmt },
      xAxis: Object.assign({ type: 'value', splitLine: SPLIT,
        axisLabel: { color: 'rgba(255,255,255,.72)', formatter: fmt } }, { axisLine: AXIS.axisLine }),
      yAxis: Object.assign({ type: 'category',
        data: tasks.map(function (t) { return t.name === 'main' ? 'main loop' : t.name; }).reverse() }, AXIS),
      series: [{ type: 'bar', barMaxWidth: 15, itemStyle: { borderRadius: [0, 6, 6, 0] },
        label: { show: true, position: 'right', color: 'rgba(255,255,255,.85)',
          fontSize: 10, formatter: function (o) { return fmt(o.value); } },
        data: tasks.slice().reverse().map(function (t, i) {
          return { value: t.value,
            itemStyle: { color: t.name === 'main' ? '#38bdf8' : color(i + 1) } };
        }) }]
    }, true);
  }

  function label() {
    document.getElementById('mu-filter').innerHTML =
      (F.profile ? 'profile <b>' + F.profile + '</b>' : 'all profiles') + ' &middot; ' +
      (F.lane ? 'provider <b>' + F.lane + '</b>' : 'all providers');
  }
  function refresh() { label(); kpis(); draw(); }

  function boot() {
    var d = payload();
    if (!d || !d.viz || !d.viz.rows || typeof echarts === 'undefined') return; // fallback stays
    V = d.viz; PAL = V.palette;
    document.getElementById('mu').className = 'on';
    refresh();
    charts['c-lane'].on('click', function (p) {
      F.lane = (F.lane === p.name) ? null : p.name; refresh();
    });
    charts['c-prof'].on('click', function (p) {
      F.profile = (F.profile === p.name) ? null : p.name; refresh();
    });
    document.getElementById('mu-reset').addEventListener('click', function () {
      F.profile = null; F.lane = null; refresh();
    });
    var t;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () {
        for (var k in charts) if (charts.hasOwnProperty(k)) charts[k].resize();
      }, 120);
    });
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else setTimeout(boot, 0);
})();
</script>
</body>
</html>
