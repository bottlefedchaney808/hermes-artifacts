<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Plays</title>
<style>
  :root{
    --bg:#141414; --panel:#1d1d1b; --panel2:#232320; --line:#33332e;
    --ink:#e8e3d8; --muted:#8a8578; --dim:#5c5850;
    --orange:#f0742a; --amber:#e8a33d; --green:#8fd674; --blue:#7fb4e8; --teal:#5ec8a8; --rose:#e85f8a;
    --mono:'Consolas','SF Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--mono);padding:24px 20px 48px;max-width:960px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--orange);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  h1 .sq{display:inline-block;width:11px;height:11px;background:var(--orange);margin-right:9px}
  .sub{color:var(--muted);font-size:11px;margin-top:2px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel)}
  .chip b{display:block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .chip span{font-size:12.5px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sym{font-size:18px;font-weight:800;letter-spacing:.5px}
  .score{font-size:18px;font-weight:800;color:var(--orange)}
  .lean{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border:1px solid;border-radius:2px;padding:2px 8px}
  .long{color:var(--green);border-color:var(--green)}
  .short{color:var(--rose);border-color:var(--rose)}
  .event{color:var(--amber);border-color:var(--amber)}
  .tape{color:var(--blue);border-color:var(--blue)}
  .fade{color:var(--muted);border-color:var(--muted)}
  .meta{color:var(--muted);font-size:12px;margin:6px 0 8px}
  .ah.up{color:var(--green)}
  .ah.dn{color:var(--rose)}
  p{margin:5px 0}
  .k{color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:1px}
  a{color:var(--blue)}
  .foot{margin-top:18px;color:var(--dim);font-size:10.5px;border-top:1px solid var(--line);padding-top:10px;line-height:1.6}
  .empty{border:1px dashed var(--line);border-radius:6px;padding:16px;color:var(--muted);background:var(--panel)}
  .empty b{color:var(--ink)}
</style>
<!--HERMES-ARTIFACT:CSS-->
<style>
/* Hermes Interactive Artifacts — universal shell styles.
   Uses Hermes ::preview theme vars when present; var() fallbacks keep it
   readable standalone in any browser. Never hardcode frame backgrounds. */
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  color: var(--foreground, #1a1a1a);
  background: var(--card, transparent);
  font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
h1 { font-size: 20px; margin: 0 0 2px; }
.ha-sub { color: var(--muted-foreground, #6b6b6b); font-size: 12px; margin-bottom: 16px; }
.ha-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 16px; }
.ha-card { border: 1px solid var(--border, #e8e6e0); border-radius: 10px; padding: 12px 14px; }
.ha-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted-foreground, #8a8a8a); }
.ha-card .value { font-size: 20px; font-weight: 650; margin-top: 3px; }
.ha-card.tone-ok .value { color: #1a7f37; }
.ha-card.tone-bad .value { color: #c0341d; }
.ha-chart { border: 1px solid var(--border, #e8e6e0); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; }
.ha-chart h3 { font-size: 14px; margin: 0 0 8px; }
.ha-chart .box { position: relative; height: 280px; }
.ha-tablewrap { border: 1px solid var(--border, #e8e6e0); border-radius: 10px;
  padding: 10px 12px 14px; margin-bottom: 16px; overflow-x: auto; }
.ha-tablewrap h3 { font-size: 14px; margin: 2px 0 8px; }
.ha-filter { width: 220px; padding: 4px 8px; margin-bottom: 8px;
  border: 1px solid var(--border, #ccc); border-radius: 6px;
  background: transparent; color: inherit; font: inherit; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 9px; white-space: nowrap;
  border-bottom: 1px solid var(--border, #efece5); }
th { cursor: pointer; color: var(--muted-foreground, #6b6b6b);
  font-size: 11px; text-transform: uppercase; }
tr:last-child td { border-bottom: none; }
.ha-notes { color: var(--muted-foreground, #6b6b6b); font-size: 12px; }
.ha-notes li { margin-bottom: 4px; }
.ha-graph { border: 1px solid var(--border, #e8e6e0); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; }
.ha-graph h3 { font-size: 14px; margin: 0 0 8px; }
.ha-glegend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px;
  color: var(--muted-foreground, #6b6b6b); margin-bottom: 8px; }
.ha-glegend .swatch { display: inline-flex; align-items: center; gap: 6px; }
.ha-glegend i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
/* Jarvis graph stage: base color only here (kills white-flash before JS paints).
   The radial vignette + faint dot grid are drawn per-frame on the canvas inside
   renderGraph() — see spec §2 Rendering. Do NOT add a CSS gradient to this rule;
   it would double-paint under the canvas fill. */
.ha-gstage { position: relative; height: 560px; border-radius: 10px; overflow: hidden; background: #05070c; }
.ha-gstage canvas { display: block; width: 100%; height: 560px; cursor: grab; }
.ha-gtip { display: none; position: absolute; pointer-events: none; }
.ha-gtip { background: rgba(8,12,20,.92); border: 1px solid rgba(148,163,184,.35); color: #e5e7eb; border-radius: 6px; padding: 4px 8px; box-shadow: 0 0 6px rgba(0,0,0,.4); font-size: 12px; }
.ha-ghost-toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(8,12,20,.92); border: 1px solid rgba(148,163,184,.35); color: #e5e7eb; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.ha-ghost-toast.on { opacity: 1; }
.ha-glegend i { box-shadow: 0 0 6px rgba(255,255,255,.35); }

/* Embed / Brain-tab mode: graph only, no white chrome, full viewport. */
html.ha-embed, html.ha-embed body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #05070c; color: #e5e7eb;
}
html.ha-embed #app { height: 100%; }
html.ha-embed .ha-graph {
  border: none; padding: 0; margin: 0; border-radius: 0;
  height: 100%; display: flex; flex-direction: column; position: relative;
}
html.ha-embed .ha-graph h3 { display: none; }
html.ha-embed .ha-glegend {
  position: absolute; z-index: 2; left: 12px; bottom: 12px;
  margin: 0; color: rgba(229, 231, 235, 0.65); pointer-events: none;
  text-shadow: 0 0 8px rgba(5, 7, 12, 0.9);
}
html.ha-embed .ha-glegend i { box-shadow: 0 0 10px currentColor; }
html.ha-embed .ha-gstage {
  flex: 1; height: auto !important; min-height: 0; border-radius: 0;
}
html.ha-embed .ha-gstage canvas { width: 100%; height: 100% !important; }

</style>
<!--/HERMES-ARTIFACT:CSS-->
</head>
<body>
  <div id="dp">
    <header>
      <h1><span class="sq"></span><span id="h1">Daily Plays</span></h1>
    </header>
    <p class="sub" id="sub">Full market scan with history.</p>
    <div class="chips" id="chips"></div>
    <div id="grid"></div>
    <p class="foot">Research only — no orders placed. Score = persistence + catalyst + corroboration + tape alignment, minus extension / binary haircuts.</p>
  </div>
  <div id="app" style="display:none"></div>

<!--HERMES-ARTIFACT:JS-->
<script>
/* Hermes Interactive Artifacts — universal renderer.
   Reads the inline JSON payload written by tools/refresh.py and renders
   summary cards, charts (Chart.js if the CDN is reachable), and
   filterable/sortable tables. No build step, no fetches, no framework. */
(function () {
  'use strict';
  /* Vivid, full-opacity palette per Jason's chart preferences. */
  var PALETTE = ['#3b82f6', '#ef4444', '#22c55e', '#eab308', '#a855f7', '#06b6d4'];

  function h(tag, attrs) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'class') node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      if (arguments[i]) node.appendChild(arguments[i]);
    }
    return node;
  }

  function payload() {
    return JSON.parse(document.getElementById('hermes-artifact-data').textContent);
  }

  function renderCards(d) {
    var wrap = h('div', { class: 'ha-cards' });
    (d.summary || []).forEach(function (c) {
      wrap.appendChild(h('div', { class: 'ha-card' + (c.tone ? ' tone-' + c.tone : '') },
        h('div', { class: 'label', text: c.label }),
        h('div', { class: 'value', text: String(c.value) })));
    });
    return wrap;
  }

  function renderChart(chart) {
    var box = h('div', { class: 'ha-chart' }, h('h3', { text: chart.title }));
    if (typeof Chart === 'undefined') {
      box.appendChild(h('div', { class: 'ha-notes',
        text: 'Chart.js CDN unreachable — values remain in tables/notes.' }));
      return box;
    }
    var canvas = h('canvas');
    box.appendChild(h('div', { class: 'box' }, canvas));
    var datasets = (chart.series || []).map(function (s, i) {
      return {
        label: s.label,
        data: s.data,
        backgroundColor: PALETTE[i % PALETTE.length],
        borderColor: PALETTE[i % PALETTE.length],
        borderWidth: 2, tension: 0.35, pointRadius: 2,
        fill: chart.type === 'line'
      };
    });
    new Chart(canvas.getContext('2d'), {
      type: chart.type,
      data: { labels: chart.labels || [], datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
      }
    });
    return box;
  }

  function renderTable(table) {
    var wrap = h('div', { class: 'ha-tablewrap' }, h('h3', { text: table.title }));
    var filter = h('input', { class: 'ha-filter', placeholder: 'Filter...' });
    var tbl = h('table');
    var headRow = h('tr');
    var thead = h('thead'), tbody = h('tbody');
    (table.columns || []).forEach(function (c) {
      headRow.appendChild(h('th', { text: c }));
    });
    thead.appendChild(headRow);
    tbl.appendChild(thead);
    tbl.appendChild(tbody);
    var rows = table.rows || [];

    function fill(list) {
      tbody.textContent = '';
      list.forEach(function (r) {
        var tr = h('tr');
        (table.columns || []).forEach(function (_, i) {
          tr.appendChild(h('td', { text: r[i] == null ? '' : String(r[i]) }));
        });
        tbody.appendChild(tr);
      });
    }
    fill(rows);
    filter.addEventListener('input', function () {
      var q = filter.value.toLowerCase();
      fill(rows.filter(function (r) {
        return r.some(function (cell) {
          return String(cell == null ? '' : cell).toLowerCase().indexOf(q) !== -1;
        });
      }));
    });
    var sortDir = {};
    headRow.addEventListener('click', function (e) {
      var idx = Array.prototype.indexOf.call(headRow.children, e.target);
      if (idx < 0) return;
      sortDir[idx] = !sortDir[idx];
      fill(rows.slice().sort(function (a, b) {
        var x = a[idx], y = b[idx];
        var nx = parseFloat(x), ny = parseFloat(y);
        var cmp = (!isNaN(nx) && !isNaN(ny)) ? nx - ny
          : String(x).localeCompare(String(y));
        return sortDir[idx] ? cmp : -cmp;
      }));
    });
    wrap.appendChild(filter);
    wrap.appendChild(tbl);
    return wrap;
  }

  var GROUP_COLOR = {
    construction: '#f59e0b',
    development: '#3b82f6',
    trading: '#22c55e',
    hub: '#eab308',
    daily: '#a855f7',
    inbox: '#ef4444',
    dangling: '#94a3b8',
    templates: '#06b6d4',
    attachments: '#64748b'
  };

  /* Jarvis brain — cinematic force graph of the vault. Canvas renderer with
     d3-force physics (when reachable), manual zoom/pan transform state, hover
     neighborhood isolation, and click-to-open in Obsidian. Falls back to a
     compact hand-rolled sim when the d3 CDN is unreachable. ES5 on purpose:
     this file ships inline into single-file artifacts with no build step. */

  var OBSIDIAN_VAULT = 'obsidian-vault';
  // Single-instance teardown handle for the live Jarvis graph (set by renderGraph's start()).
  var activeJarvisDestroy = null;

  function isEmbed() {
    try {
      var q = String(location.search || '');
      var hsh = String(location.hash || '');
      return q.indexOf('embed=1') !== -1 || hsh.indexOf('embed') !== -1;
    } catch (err) { return false; }
  }

  function hexRgb(hex) {
    var s = String(hex || '').replace('#', '');
    if (s.length === 3) s = s.charAt(0) + s.charAt(0) + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2);
    var n = parseInt(s, 16);
    if (isNaN(n)) return [148, 163, 184];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function renderGraph(graph) {
    // Empty/missing graph → return a visible note box (spec §6). Always returns a
    // DOM element so any caller's appendChild is safe; no canvas loop started.
    if (!graph || !(graph.nodes && graph.nodes.length)) {
      var emptyBox = h('div', { class: 'ha-graph' }, h('h3', { text: 'Graph view' }));
      var emptyStage = h('div', { class: 'ha-gstage' });
      emptyStage.appendChild(h('div', { class: 'ha-notes', style: 'padding:16px;', text: 'No links found in this vault.' }));
      emptyBox.appendChild(emptyStage);
      return emptyBox;
    }

    // ---- Init: degree map, adjacency (neighborhood sets), top-label set ----
    var rawNodes = graph.nodes, rawEdges = graph.edges || [];
    var deg = {}, adj = {};
    var i, n, e;
    for (i = 0; i < rawNodes.length; i++) {
      n = rawNodes[i];
      if (!deg[n.id]) deg[n.id] = 0;
      if (!adj[n.id]) adj[n.id] = {};
      adj[n.id][n.id] = true; // self, so the hovered node stays lit
    }
    for (i = 0; i < rawEdges.length; i++) {
      e = rawEdges[i];
      var a = e.source, b = e.target;
      if (!deg[a]) deg[a] = 0;
      if (!deg[b]) deg[b] = 0;
      deg[a]++; deg[b]++;
      (adj[a] || (adj[a] = {}))[b] = true;
      (adj[b] || (adj[b] = {}))[a] = true;
    }
    var topLabelSet = {};
    rawNodes.slice().sort(function (x, y) { return deg[y.id] - deg[x.id]; })
      .slice(0, 8).forEach(function (nd) { topLabelSet[nd.id] = true; });

    // Group attractor points: each distinct group gets an angle on a ~260 circle.
    var groups = [];
    rawNodes.forEach(function (nd) { if (groups.indexOf(nd.group || 'hub') === -1) groups.push(nd.group || 'hub'); });
    var groupCount = {};
    rawNodes.forEach(function (nd) { var g = nd.group || 'hub'; groupCount[g] = (groupCount[g] || 0) + 1; });
    // Big groups pull harder so they form compact blobs instead of diffuse clouds.
    function cohesionStrength(g) { return Math.min(0.12, 0.01 * Math.sqrt(groupCount[g] || 1)); }
    var attract = {};
    for (i = 0; i < groups.length; i++) {
      var ang = (i / Math.max(1, groups.length)) * Math.PI * 2;
      attract[groups[i]] = { x: Math.cos(ang) * 260, y: Math.sin(ang) * 260 };
    }

    // Sim node objects. Seed positions near the group attractor for fast convergence.
    var nodes = rawNodes.map(function (nd, idx) {
      var g = nd.group || 'hub';
      var at = attract[g] || { x: 0, y: 0 };
      return {
        id: nd.id, label: nd.label != null ? nd.label : String(nd.id), group: g,
        size: Math.max(1, nd.size || 1),
        x: at.x + (Math.random() - 0.5) * 60, y: at.y + (Math.random() - 0.5) * 60,
        vx: 0, vy: 0
      };
    });
    var byId = {};
    nodes.forEach(function (nd) { byId[nd.id] = nd; });
    // Links reference node objects directly so d3.forceLink can bind them.
    var links = [];
    for (i = 0; i < rawEdges.length; i++) {
      e = rawEdges[i];
      if (byId[e.source] && byId[e.target]) links.push({ source: byId[e.source], target: byId[e.target] });
    }

    function radius(nd) { return 3 + Math.sqrt(nd.size) * 1.8; }
    var hasD3 = typeof d3 !== 'undefined' && !!d3.forceSimulation;

    // ---- DOM scaffold (canvas, not SVG — spec §2) ----
    var box = h('div', { class: 'ha-graph' }, h('h3', { text: 'Graph view' }));
    var legend = h('div', { class: 'ha-glegend' });
    groups.forEach(function (g) {
      legend.appendChild(h('span', { class: 'swatch' },
        h('i', { style: 'background:' + (GROUP_COLOR[g] || '#94a3b8') }),
        h('span', { text: g })));
    });
    box.appendChild(legend);
    var stage = h('div', { class: 'ha-gstage' });
    var canvas = document.createElement('canvas');
    var tip = h('div', { class: 'ha-gtip', text: '' });
    var toast = h('div', { class: 'ha-ghost-toast', text: '' });
    stage.appendChild(canvas);
    stage.appendChild(tip);
    stage.appendChild(toast);
    box.appendChild(stage);

    // ---- Zoom/pan transform state (manual, spec §3). screenCSS = world*k + t ----
    var view = { k: 1, tx: 0, ty: 0 };
    function clampK(k) { return Math.max(0.25, Math.min(8, k)); }

    // ---- Canvas sizing (backing store × dpr; CSS height fixed at 560 by .ha-gstage) ----
    var cssW = 960, cssH = 560, dpr = window.devicePixelRatio || 1;
    var embed = isEmbed();
    function resize() {
      var r = stage.getBoundingClientRect();
      if (r.width > 2) cssW = Math.round(r.width);
      if (embed && r.height > 2) cssH = Math.round(r.height);
      else cssH = 560;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(cssW * dpr));
      canvas.height = Math.max(1, Math.round(cssH * dpr));
    }

    var ctx = null; // set after first resize (canvas must be in DOM)

    function showToast(msg) {
      toast.textContent = msg;
      toast.className = 'ha-ghost-toast on';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () { toast.className = 'ha-ghost-toast'; }, 2000);
    }

    // ---- Click → open note in Obsidian (spec §5, NO silent file:// fallback) ----
    function openNote(nd) {
      if (!nd || String(nd.id).indexOf('dangling:') === 0) return;
      var uri = 'obsidian://open?vault=' + encodeURIComponent(OBSIDIAN_VAULT) +
        '&file=' + encodeURIComponent(String(nd.id));
      try {
        var a = document.createElement('a');
        a.href = uri;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("Opening '" + nd.label + "' in Obsidian…");
      } catch (err) { /* custom-scheme nav may be blocked by host — toast already names the attempt */ }
    }

    // ---- Pointer state: explicit ownership so zoom/pan/drag don't fight (spec §3) ----
    var hover = null, mode = null; // mode: 'drag' | 'pan' | null
    var dragNode = null, lastX = 0, lastY = 0, downX = 0, downY = 0;

    function pointer(ev) {
      var rect = canvas.getBoundingClientRect();
      return { mx: ev.clientX - rect.left, my: ev.clientY - rect.top };
    }
    // Screen-space hit test (works under any zoom). Returns node or null.
    function pick(mx, my) {
      var best = null, bestD = 1e9;
      for (var j = 0; j < nodes.length; j++) {
        n = nodes[j];
        var sx = n.x * view.k + view.tx, sy = n.y * view.k + view.ty;
        var d = Math.hypot(sx - mx, sy - my);
        if (d < bestD) { bestD = d; best = n; }
      }
      return (best && bestD <= Math.max(10, radius(best) * view.k + 6)) ? best : null;
    }

    // ---- Draw one frame. Shared by the live and fallback paths. ----
    function draw() {
      if (!ctx) ctx = canvas.getContext('2d');
      var W = cssW, H = cssH;
      var tnow = Date.now() / 1000;
      var pulse = 0.72 + 0.28 * Math.sin(tnow * 1.7);
      // (1)-(3): screen-space background — fill, radial vignette, faint dot grid.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#05070c';
      ctx.fillRect(0, 0, W, H);
      var vg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, embed ? 'rgba(56, 80, 140, 0.38)' : 'rgba(30,41,66,0.55)');
      vg.addColorStop(1, 'rgba(5,7,12,0)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      if (nodes.length <= 1500) {
        ctx.fillStyle = embed ? 'rgba(148,163,184,0.08)' : 'rgba(148,163,184,0.05)';
        for (var gx = 20; gx < W; gx += 40) for (var gy = 20; gy < H; gy += 40) { ctx.fillRect(gx, gy, 1, 1); }
      }

      // World pass: apply zoom transform. screenCSS = world*k + t.
      var k = view.k, tx = view.tx, ty = view.ty;
      ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * tx, dpr * ty);

      // Edges first (spec §2): alpha modulated by hover neighborhood.
      var litSet = hover ? adj[hover.id] : null;
      ctx.lineCap = 'round';
      for (var li = 0; li < links.length; li++) {
        e = links[li];
        var touchesHover = hover && (e.source === hover || e.target === hover);
        var alpha = !hover ? (embed ? 0.16 : 0.10) : (touchesHover ? 0.72 : 0.03);
        var col = hexRgb(GROUP_COLOR[e.source.group] || '#94a3b8');
