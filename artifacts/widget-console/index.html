    nodes.forEach(function (nd) { byId[nd.id] = nd; });
    // Links reference node objects directly so d3.forceLink can bind them.
    var links = [];
    for (i = 0; i < rawEdges.length; i++) {
      e = rawEdges[i];
      if (byId[e.source] && byId[e.target]) links.push({ source: byId[e.source], target: byId[e.target] });
    }

    function radius(nd) { return 3 + Math.sqrt(nd.size) * 1.8; }
    var hasD3 = typeof d3 !== 'undefined' && !!d3.forceSimulation;

    // ---- DOM scaffold (canvas, not SVG — spec §2) ----
    var box = h('div', { class: 'ha-graph' }, h('h3', { text: 'Graph view' }));
    var legend = h('div', { class: 'ha-glegend' });
    groups.forEach(function (g) {
      legend.appendChild(h('span', { class: 'swatch' },
        h('i', { style: 'background:' + (GROUP_COLOR[g] || '#94a3b8') }),
        h('span', { text: g })));
    });
    box.appendChild(legend);
    var stage = h('div', { class: 'ha-gstage' });
    var canvas = document.createElement('canvas');
    var tip = h('div', { class: 'ha-gtip', text: '' });
    var toast = h('div', { class: 'ha-ghost-toast', text: '' });
    stage.appendChild(canvas);
    stage.appendChild(tip);
    stage.appendChild(toast);
    box.appendChild(stage);

    // ---- Zoom/pan transform state (manual, spec §3). screenCSS = world*k + t ----
    var view = { k: 1, tx: 0, ty: 0 };
    function clampK(k) { return Math.max(0.25, Math.min(8, k)); }

    // ---- Canvas sizing (backing store × dpr; CSS height fixed at 560 by .ha-gstage) ----
    var cssW = 960, cssH = 560, dpr = window.devicePixelRatio || 1;
    var embed = isEmbed();
    function resize() {
      var r = stage.getBoundingClientRect();
      if (r.width > 2) cssW = Math.round(r.width);
      if (embed && r.height > 2) cssH = Math.round(r.height);
      else cssH = 560;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(cssW * dpr));
      canvas.height = Math.max(1, Math.round(cssH * dpr));
    }

    var ctx = null; // set after first resize (canvas must be in DOM)

    function showToast(msg) {
      toast.textContent = msg;
      toast.className = 'ha-ghost-toast on';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () { toast.className = 'ha-ghost-toast'; }, 2000);
    }

    // ---- Click → open note in Obsidian (spec §5, NO silent file:// fallback) ----
    function openNote(nd) {
      if (!nd || String(nd.id).indexOf('dangling:') === 0) return;
      var uri = 'obsidian://open?vault=' + encodeURIComponent(OBSIDIAN_VAULT) +
        '&file=' + encodeURIComponent(String(nd.id));
      try {
        var a = document.createElement('a');
        a.href = uri;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("Opening '" + nd.label + "' in Obsidian…");
      } catch (err) { /* custom-scheme nav may be blocked by host — toast already names the attempt */ }
    }

    // ---- Pointer state: explicit ownership so zoom/pan/drag don't fight (spec §3) ----
    var hover = null, mode = null; // mode: 'drag' | 'pan' | null
    var dragNode = null, lastX = 0, lastY = 0, downX = 0, downY = 0;

    function pointer(ev) {
      var rect = canvas.getBoundingClientRect();
      return { mx: ev.clientX - rect.left, my: ev.clientY - rect.top };
    }
    // Screen-space hit test (works under any zoom). Returns node or null.
    function pick(mx, my) {
      var best = null, bestD = 1e9;
      for (var j = 0; j < nodes.length; j++) {
        n = nodes[j];
        var sx = n.x * view.k + view.tx, sy = n.y * view.k + view.ty;
        var d = Math.hypot(sx - mx, sy - my);
        if (d < bestD) { bestD = d; best = n; }
      }
      return (best && bestD <= Math.max(10, radius(best) * view.k + 6)) ? best : null;
    }

    // ---- Draw one frame. Shared by the live and fallback paths. ----
    function draw() {
      if (!ctx) ctx = canvas.getContext('2d');
      var W = cssW, H = cssH;
      var tnow = Date.now() / 1000;
      var pulse = 0.72 + 0.28 * Math.sin(tnow * 1.7);
      // (1)-(3): screen-space background — fill, radial vignette, faint dot grid.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#05070c';
      ctx.fillRect(0, 0, W, H);
      var vg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, embed ? 'rgba(56, 80, 140, 0.38)' : 'rgba(30,41,66,0.55)');
      vg.addColorStop(1, 'rgba(5,7,12,0)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      if (nodes.length <= 1500) {
        ctx.fillStyle = embed ? 'rgba(148,163,184,0.08)' : 'rgba(148,163,184,0.05)';
        for (var gx = 20; gx < W; gx += 40) for (var gy = 20; gy < H; gy += 40) { ctx.fillRect(gx, gy, 1, 1); }
      }

      // World pass: apply zoom transform. screenCSS = world*k + t.
      var k = view.k, tx = view.tx, ty = view.ty;
      ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * tx, dpr * ty);

      // Edges first (spec §2): alpha modulated by hover neighborhood.
      var litSet = hover ? adj[hover.id] : null;
      ctx.lineCap = 'round';
      for (var li = 0; li < links.length; li++) {
        e = links[li];
        var touchesHover = hover && (e.source === hover || e.target === hover);
        var alpha = !hover ? (embed ? 0.16 : 0.10) : (touchesHover ? 0.72 : 0.03);
        var col = hexRgb(GROUP_COLOR[e.source.group] || '#94a3b8');
        if (embed && touchesHover) {
          ctx.shadowBlur = 18 / k;
          ctx.shadowColor = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.85)';
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.lineWidth = (touchesHover ? 1.6 : (embed ? 1.05 : 0.8)) / k;
        ctx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Nodes: bloom (embed) → glow → core. Dim non-neighbors on hover.
      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];
        var lit = !hover || (litSet && litSet[n.id]);
        var gcol = GROUP_COLOR[n.group] || '#94a3b8';
        var rgb = hexRgb(gcol);
        var r = radius(n);
        ctx.globalAlpha = lit ? 1 : 0.08;
        if (embed) {
          ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.18 * pulse).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(n.x, n.y, r * (3.4 + pulse), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = Math.min(embed ? 56 : 40, (embed ? 18 : 12) + n.size * (embed ? 2.2 : 1));
        ctx.shadowColor = gcol;
        ctx.fillStyle = gcol;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f8fafc';
        ctx.globalAlpha = lit ? (embed ? 0.95 : 0.85) : 0.08;
        ctx.beginPath();
        ctx.arc(n.x, n.y, Math.max(1.1, r * 0.38), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // Labels in SCREEN space (reset transform) — sparse per spec §2.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = embed ? '600 11px sans-serif' : '11px sans-serif';
      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];
        var showLabel = hover ? (!!litSet && litSet[n.id]) : (topLabelSet[n.id] || k > 2);
        if (!showLabel) continue;
        var sx = n.x * k + tx, sy = n.y * k + ty;
        // Cull off-screen when in zoomed label mode.
        if (k > 2 && (sx < -40 || sx > W + 40 || sy < -16 || sy > H + 16)) continue;
        var litL = !hover || (litSet && litSet[n.id]);
        ctx.globalAlpha = litL ? 0.95 : 0.25;
        ctx.shadowBlur = embed ? 10 : 0;
        ctx.shadowColor = embed ? (GROUP_COLOR[n.group] || '#94a3b8') : 'transparent';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(n.label, sx + radius(n) * k + 3, sy + 4);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // ---- Fallback: compact hand-rolled sim when d3 is absent (spec §6). ----
    function fallbackStep() {
      var j, m, dx, dy, dist, f;
      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          m = nodes[j];
          dx = n.x - m.x; dy = n.y - m.y; dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          f = 420 / (dist * dist);
          n.vx += dx / dist * f; n.vy += dy / dist * f;
          m.vx -= dx / dist * f; m.vy -= dy / dist * f;
        }
      }
      for (i = 0; i < links.length; i++) {
        e = links[i];
        dx = e.target.x - e.source.x; dy = e.target.y - e.source.y; dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        f = (dist - 46) * 0.012;
        e.source.vx += dx / dist * f; e.source.vy += dy / dist * f;
        e.target.vx -= dx / dist * f; e.target.vy -= dy / dist * f;
      }
      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];
        var g = attract[n.group] || { x: 0, y: 0 };
        n.vx += (g.x - n.x) * 0.004 + (-n.x) * 0.002;
        n.vy += (g.y - n.y) * 0.004 + (-n.y) * 0.002;
        if (dragNode !== n) { n.vx *= 0.72; n.vy *= 0.72; n.x += n.vx; n.y += n.vy; }
      }
    }

    // ---- Wire up events + start the loop once canvas is measurable. ----
    function onWheel(ev) {
      if (!hasD3) return; // fallback path: no zoom (spec §6)
      ev.preventDefault();
      var p = pointer(ev);
      var factor = Math.pow(2, -ev.deltaY * 0.002);
      var newK = clampK(view.k * factor);
      view.tx = p.mx - (p.mx - view.tx) * (newK / view.k);
      view.ty = p.my - (p.my - view.ty) * (newK / view.k);
      view.k = newK;
    }
    function onDown(ev) {
      var p = pointer(ev);
      downX = p.mx; downY = p.my; lastX = p.mx; lastY = p.my;
      dragNode = pick(p.mx, p.my);
      if (dragNode) { mode = 'drag'; if (hasD3) sim.alphaTarget(0.3); } // fallback: reposition only (spec §6)
      else if (!dragNode && hasD3) { mode = 'pan'; }
    }
    function onMove(ev) {
      var p = pointer(ev);
      if (mode === 'drag' && dragNode) {
        dragNode.x = (p.mx - view.tx) / view.k;
        dragNode.y = (p.my - view.ty) / view.k;
        dragNode.vx = 0; dragNode.vy = 0;
      } else if (mode === 'pan') {
        view.tx += p.mx - lastX; view.ty += p.my - lastY;
        lastX = p.mx; lastY = p.my;
      } else {
        hover = pick(p.mx, p.my);
        tip.style.display = hover ? 'block' : 'none';
        if (hover) {
          var unresolved = String(hover.id).indexOf('dangling:') === 0;
          tip.textContent = hover.label + '  ·  ' + hover.group + '  ·  deg ' + (deg[hover.id] || 0) +
            (unresolved ? '  ·  unresolved link' : '');
          tip.style.left = (p.mx + 12) + 'px';
          tip.style.top = (p.my + 12) + 'px';
        }
      }
    }
    function onUp(ev) {
      var p = pointer(ev);
      if (mode === 'drag') sim.alphaTarget(0);
      // Click = up with negligible movement.
      if (Math.hypot(p.mx - downX, p.my - downY) < 4 && dragNode) {
        openNote(dragNode);
      } else if (String((pick(p.mx, p.my) || {}).id).indexOf('dangling:') === 0) {
        showToast('Unresolved link');
      }
      mode = null; dragNode = null;
    }

    var sim = null;
    // Single-instance guard: only one live Jarvis graph at a time. If renderGraph is
    // called again (re-render / refresh), tear down the previous instance first so
    // window-level listeners + rAF loop never accumulate across renders.
    if (typeof activeJarvisDestroy === 'function') { try { activeJarvisDestroy(); } catch (e) {} }

    // Auto-fit: frame the whole graph in ~90% of the stage, centered (like Obsidian's fit-to-view).
    function autoFit() {
      if (!nodes.length) return;
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      for (var j = 0; j < nodes.length; j++) {
        n = nodes[j];
        if (n.x < minX) minX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.x > maxX) maxX = n.x;
        if (n.y > maxY) maxY = n.y;
      }
      var bw = Math.max(60, maxX - minX), bh = Math.max(60, maxY - minY);
      view.k = clampK(Math.min(cssW * 0.9 / bw, cssH * 0.9 / bh));
      view.tx = (cssW - bw * view.k) / 2 - minX * view.k;
      view.ty = (cssH - bh * view.k) / 2 - minY * view.k;
    }

    function start() {
      resize();
      // Center world origin in the viewport so the ~260-radius attractor circle fits.
      view.tx = cssW / 2;
      view.ty = cssH / 2;
      window.addEventListener('resize', resize);
      var ro = null;
      if (typeof ResizeObserver !== 'undefined') {
        ro = new ResizeObserver(function () { resize(); });
        ro.observe(stage);
      }
      if (hasD3) {
        // d3-force physics with the exact verified v7 API surface.
        sim = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(function (d) { return d.id; })
            .distance(46)
            .strength(function (l) {
              var idOf = function (x) { return typeof x === 'object' ? x.id : x; };
              return 0.5 / Math.max(deg[idOf(l.source)] || 1, deg[idOf(l.target)] || 1);
            }))
          .force('charge', d3.forceManyBody().theta(0.9)
            .strength(function (nd) { return -10 * (1 + Math.sqrt(nd.size) * 0.4); }))
          .force('collide', d3.forceCollide(radius).iterations(2))
          .force('gx', d3.forceX(function (nd) { return (attract[nd.group] || { x: 0 }).x; })
            .strength(function (nd) { return cohesionStrength(nd.group); }))
          .force('gy', d3.forceY(function (nd) { return (attract[nd.group] || { y: 0 }).y; })
            .strength(function (nd) { return cohesionStrength(nd.group); }));

        canvas.addEventListener('wheel', onWheel, { passive: false });
      } else {
        // Settle the hand-rolled sim synchronously before first paint.
        for (var t = 0; t < 150; t++) fallbackStep();
      }
      canvas.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);

      var fitted = false;
      function maybeFit() { if (!fitted) { autoFit(); fitted = true; } }
      if (hasD3) setTimeout(maybeFit, 1500); // let the sim settle before framing
      else maybeFit();

      var rafId = 0;
      function loop() {
        if (!hasD3) fallbackStep(); // keep the static layout gently alive / responsive to drag
        draw();
        rafId = requestAnimationFrame(loop);
      }
      loop();

      // Teardown: stop rAF, remove every listener this instance added (window-level ones
      // outlive the DOM box that render() clears), and halt the sim. Called by a later
      // renderGraph via activeJarvisDestroy so re-renders never stack handlers/loops.
      function destroy() {
        cancelAnimationFrame(rafId);
        window.removeEventListener('resize', resize);
        if (ro) { try { ro.disconnect(); } catch (e) {} }
        canvas.removeEventListener('wheel', onWheel);
        canvas.removeEventListener('mousedown', onDown);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        if (sim && sim.stop) { try { sim.alphaTarget(0).stop(); } catch (e) {} }
      }
      activeJarvisDestroy = destroy;
    }

    // Defer start until the stage has a measurable width (it's appended during render()).
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 0); });
    } else {
      setTimeout(start, 0);
    }

    return box;
  }
  function render(root) {
    var d = payload();
    root.textContent = '';
    if (isEmbed()) {
      try { document.documentElement.classList.add('ha-embed'); } catch (e) {}
      if (d.graph && (d.graph.nodes || []).length) root.appendChild(renderGraph(d.graph));
      else root.appendChild(renderGraph(null));
      return;
    }
    root.appendChild(h('h1', { text: d.title || d.artifact_id }));
    root.appendChild(h('div', { class: 'ha-sub', text: 'Generated '
      + d.generated_at + (d.source && d.source.note ? ' - ' + d.source.note : '') }));
    if ((d.summary || []).length) root.appendChild(renderCards(d));
    if (d.graph && (d.graph.nodes || []).length) root.appendChild(renderGraph(d.graph));
    (d.charts || []).forEach(function (c) { root.appendChild(renderChart(c)); });
    (d.tables || []).forEach(function (t) { root.appendChild(renderTable(t)); });
    if ((d.notes || []).length) {
      var ul = h('ul', { class: 'ha-notes' });
      d.notes.forEach(function (n) { ul.appendChild(h('li', { text: n })); });
      root.appendChild(ul);
    }
  }

  window.HermesArtifact = { render: render };
  document.addEventListener('DOMContentLoaded', function () {
    render(document.getElementById('app'));
  });
})();

<script>
(function() {
  'use strict';

  // State
  var widgets = [];
  var selectedWidgets = new Set();
  var runningQueue = [];
  var isRunning = false;
  var abortRequested = false;
  var ticker = 'SPY';

  // DOM elements
  var appEl = document.getElementById('app');
  var tickerInput = document.getElementById('tickerInput');
  var runBtn = document.getElementById('runBtn');
  var stopBtn = document.getElementById('stopBtn');
  var filterInput = document.getElementById('filterInput');
  var groupSelect = document.getElementById('groupSelect');
  var widgetsList = document.getElementById('widgetsList');
  var runLog = document.getElementById('runLog');

  // API
  var API_BASE = 'http://127.0.0.1:8787';

  // Initialize
  function init() {
    loadCatalog();
    renderGroupSelect();
    renderWidgets();
    setupEvents();
  }

  function loadCatalog() {
    // Try live catalog first
    fetch(API_BASE + '/api/widgets/catalog', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        widgets = (data.widgets || data || []).map(function(w) {
          return {
            name: w.name || w.slug,
            slug: w.slug,
            suite: w.suite || 'misc',
            category: w.category || 'other',
            inputs: w.inputs || {},
            defaultSelected: w.default_selected || false,
            requires: w.requires || []
          };
        });
        // Apply default selected
        widgets.forEach(function(w) { if (w.defaultSelected) selectedWidgets.add(w.slug); });
        renderWidgets();
      })
      .catch(function(err) {
        // API down - show banner, load cached data.json if available
        showApiDownBanner();
        // Try to load data.json from this artifact
        loadCachedData();
      });
  }

  function loadCachedData() {
    // For read-only mode when API is down, try to read data.json
    // In a real browser, file:// will fail, so we just show the banner
    // The catalog is still useful read-only from a prior run
  }

  function showApiDownBanner() {
    var banner = document.createElement('div');
    banner.className = 'api-down-banner';
    banner.innerHTML = '<strong>Dashboard API not reachable.</strong> Start dashboard.bat, then refresh this board. The console UI will retry the catalog live when you open it.';
    var existing = document.querySelector('.api-down-banner');
    if (!existing) appEl.insertBefore(banner, appEl.firstChild);
  }

  function renderGroupSelect() {
    var suites = {};
    widgets.forEach(function(w) { suites[w.suite] = true; });
    var suiteList = Object.keys(suites).sort();
    groupSelect.innerHTML = '';
    suiteList.forEach(function(suite) {
      var el = document.createElement('div');
      el.className = 'group-item';
      el.textContent = suite;
      el.dataset.suite = suite;
      el.addEventListener('click', function() { toggleSuite(suite); });
      groupSelect.appendChild(el);
    });
  }

  function toggleSuite(suite) {
    var allSelected = true;
    widgets.forEach(function(w) { if (w.suite === suite && !selectedWidgets.has(w.slug)) allSelected = false; });
    widgets.forEach(function(w) {
      if (w.suite === suite) {
        if (allSelected) selectedWidgets.delete(w.slug); else selectedWidgets.add(w.slug);
      }
    });
    renderWidgets();
  }

  function renderWidgets() {
    var filter = filterInput.value.toLowerCase();
    var filtered = widgets.filter(function(w) {
      if (filter && w.name.toLowerCase().indexOf(filter) === -1 && w.slug.indexOf(filter) === -1) return false;
      return true;
    });
    widgetsList.innerHTML = '';
    filtered.forEach(function(w) {
      var el = document.createElement('div');
      el.className = 'widget-card' + (w.defaultSelected ? ' cached' : '');
      el.innerHTML = '\n      <div class="widget-header">\n        <label class="widget-name">' + escapeHtml(w.name) + '</label>\n        <button class="status-dot" title="' + (selectedWidgets.has(w.slug) ? 'Selected' : 'Not selected') + '"></button>\n      </div>\n      <div class="widget-meta">' + w.slug + ' • ' + w.suite + '/' + w.category + '</div>\n      <div class="widget-content"></div>\n    ';
      var header = el.querySelector('.widget-header');
      header.addEventListener('click', function(e) {
        if (e.target.tagName !== 'BUTTON') {
          if (selectedWidgets.has(w.slug)) selectedWidgets.delete(w.slug); else selectedWidgets.add(w.slug);
          renderWidgets();
        }
      });
      widgetsList.appendChild(el);
    });
    runBtn.disabled = selectedWidgets.size === 0;
    updateStopButton();
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function setupEvents() {
    runBtn.addEventListener('click', runSelected);
    stopBtn.addEventListener('click', stopRunning);
    filterInput.addEventListener('input', renderWidgets);
    tickerInput.addEventListener('change', function() { ticker = tickerInput.value.trim() || 'SPY'; });
  }

  function updateStopButton() {
    stopBtn.disabled = !isRunning;
  }

  function logRun(slug, status, elapsed) {
    var div = document.createElement('div');
    div.className = status === 'ok' ? 'ok' : 'fail';
    var timeStr = elapsed >= 0 ? ' (' + elapsed.toFixed(1) + 's)' : '';
    div.textContent = (new Date()).toLocaleTimeString() + ' • ' + slug + ' ' + status.toUpperCase() + timeStr;
    runLog.appendChild(div);
    runLog.scrollTop = runLog.scrollHeight;
  }

  async function runSelected() {
    if (selectedWidgets.size === 0) return;
    if (isRunning) return;
    abortRequested = false;
    isRunning = true;
    updateStopButton();

    var queue = [];
    widgets.forEach(function(w) {
      if (selectedWidgets.has(w.slug)) queue.push(w.slug);
    });

    for (var i = 0; i < queue.length; i++) {
      if (abortRequested) {
        logRun(queue[i], 'aborted', -1);
        continue;
      }
      var slug = queue[i];
      await runWidget(slug);
    }

    isRunning = false;
    updateStopButton();
  }

  async function runWidget(slug) {
    // Find widget card
    var cards = Array.from(widgetsList.querySelectorAll('.widget-card'));
    var card = cards.find(function(c) { return c.textContent.indexOf(slug) > -1; });
    if (!card) return;

    // Update status to running
    var dot = card.querySelector('.status-dot');
    dot.className = 'status-dot running';
    dot.title = 'Running...';

    var startTime = Date.now();

    try {
      var resp = await fetch(API_BASE + '/api/widgets/' + slug + '/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope: { ticker: ticker } })
      });
      var data = await resp.json();

      var elapsed = (Date.now() - startTime) / 1000;
      var status = data.status === 'ok' ? 'ok' : 'failed';

      if (status === 'ok') {
        renderWidgetResult(card, data);
      } else {
        renderWidgetError(card, data);
      }
      dot.className = 'status-dot ' + status;
      dot.title = status.toUpperCase();
      logRun(slug, status, elapsed);
    } catch (err) {
      var elapsed = (Date.now() - startTime) / 1000;
      card.querySelector('.widget-content').innerHTML = '<div class="headline">Error: ' + escapeHtml(err.message || String(err)) + '</div>';
      var dot = card.querySelector('.status-dot');
      dot.className = 'status-dot failed';
      dot.title = 'Failed';
      logRun(slug, 'error', elapsed);
    }
  }

  function renderWidgetResult(card, data) {
    var content = card.querySelector('.widget-content');
    var metrics = data.metrics || {};
    var headline = getHeadline(data.slug, metrics);
    var html = '<div class="headline">' + headline + '</div>';
    // Add cached chip if applicable
    if (card.classList.contains('cached')) {
      html += '<div class="cached-chip">Cached</div>';
    }
    // JSON body
    html += '<details class="json-details"><summary>JSON result</summary><pre>' + escapeHtml(JSON.stringify(data, null, 2).slice(0, 20000)) + '</pre></details>';
    content.innerHTML = html;
  }

  function renderWidgetError(card, data) {
    var content = card.querySelector('.widget-content');
    var err = data.metrics && data.metrics.error ? data.metrics.error : JSON.stringify(data);
    content.innerHTML = '<div class="headline">Failed: ' + escapeHtml(err) + '</div><details class="json-details"><summary>Response</summary><pre>' + escapeHtml(JSON.stringify(data, null, 2)) + '</pre></details>';
  }

  function getHeadline(slug, metrics) {
    // Category-specific headline mappings
    var mappings = {
      'gex': ['total_net_dollar_gamma', 'gamma_flip_level'],
      'max_pain': ['max_pain_strike', 'price_vs_pain_pct'],
      'iv_rank': ['atm_iv_pct', 'regime'],
      'skew': ['skew_signal', 'put_skew_pts'],
      'dual_book': ['position_regime', 'position_z'],
      'dealer_exposure': ['band_regime', 'band_z']
    };
    var keys = mappings[slug] || ['status'];
    var parts = [];
    keys.forEach(function(k) {
      if (metrics[k] !== undefined) parts.push(k + ': ' + metrics[k]);
    });
    return parts.length > 0 ? parts.join(' • ') : (metrics.status || 'completed');
  }

  function stopRunning() {
    abortRequested = true;
  }

  // Start
  init();
})();
</script>
</body>
</html>
